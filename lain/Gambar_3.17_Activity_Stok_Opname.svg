<svg viewBox="0 0 1100 1340" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="font-family: Arial, sans-serif; background: #ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Border & Header -->
  <rect x="10" y="10" width="1080" height="1320" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="10" y="10" width="1080" height="35" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <text x="550" y="33" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">Kelola Stok Opname (Freeze Lock, 3 Kondisi Blind Count, Verifikasi Selisih &amp; Berita Acara)</text>

  <!-- 4 Swimlane Headers -->
  <rect x="10" y="45" width="250" height="32" fill="#f1f5f9" stroke="#0f172a" stroke-width="1"/>
  <text x="135" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Superadmin (Pemilik)</text>

  <rect x="260" y="45" width="270" height="32" fill="#f1f5f9" stroke="#0f172a" stroke-width="1"/>
  <text x="395" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Kasir (Pencacah Lapangan)</text>

  <rect x="530" y="45" width="270" height="32" fill="#f1f5f9" stroke="#0f172a" stroke-width="1"/>
  <text x="665" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Admin Toko (Verifikator)</text>

  <rect x="800" y="45" width="290" height="32" fill="#f1f5f9" stroke="#0f172a" stroke-width="1"/>
  <text x="945" y="66" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0f172a">Sistem Server</text>

  <!-- Dividers -->
  <line x1="260" y1="45" x2="260" y2="1330" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="530" y1="45" x2="530" y2="1330" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="800" y1="45" x2="800" y2="1330" stroke="#0f172a" stroke-width="1.5"/>

  <!-- ================= 1. SUPERADMIN: INIT OPNAME ================= -->
  <circle cx="135" cy="95" r="9" fill="#0f172a"/>
  <line x1="135" y1="104" x2="135" y2="125" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="25" y="125" width="220" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="143" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Buka Menu Stok Opname &amp;</text>
  <text x="135" y="156" text-anchor="middle" font-size="9" fill="#0f172a">Tentukan Jadwal Sesi Opname</text>
  <line x1="135" y1="167" x2="135" y2="190" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="25" y="190" width="220" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="208" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Tekan Tombol</text>
  <text x="135" y="221" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">"Mulai Sesi Stok Opname Baru"</text>

  <!-- Superadmin ke Sistem (Freeze Lock) -->
  <path d="M 245 211 L 820 211" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sistem: Freeze Lock & Snapshot -->
  <rect x="820" y="190" width="250" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="207" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Aktifkan Freeze Lock Transaksi (423)</text>
  <text x="945" y="220" text-anchor="middle" font-size="8.5" fill="#dc2626">(Kunci Kasir POS &amp; Checkout Daring)</text>
  <text x="945" y="231" text-anchor="middle" font-size="8" fill="#0f172a">Snapshot 111 Entitas Persediaan</text>
  <line x1="945" y1="236" x2="945" y2="265" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="265" width="250" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="282" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Buka Layar Pencacahan Fisik Buta</text>
  <text x="945" y="296" text-anchor="middle" font-size="8" fill="#0f172a">(Blind Count: Stok Buku &amp; Reserved Disembunyikan)</text>

  <!-- Sistem ke Kasir -->
  <path d="M 820 286 L 510 286" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= 2. KASIR: HITUNG FISIK 3 KONDISI ================= -->
  <rect x="280" y="265" width="230" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="395" y="282" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Login Kasir: Otomatis Masuk ke</text>
  <text x="395" y="295" text-anchor="middle" font-size="8.5" fill="#0f172a">Input Fisik Stok Opname</text>
  <line x1="395" y1="307" x2="395" y2="330" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="330" width="230" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="395" y="347" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Hitung Fisik Rak &amp; Scan Barcode:</text>
  <text x="395" y="359" text-anchor="middle" font-size="8" fill="#0f172a">Input 3 Kolom: Baik, Rusak, Expired</text>
  <text x="395" y="370" text-anchor="middle" font-size="8" fill="#dc2626">(Batch Kedaluwarsa Otomatis Terkunci)</text>
  <line x1="395" y1="376" x2="395" y2="400" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="280" y="400" width="230" height="38" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="395" y="423" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Tekan "Simpan Hasil Hitung"</text>

  <!-- Kasir ke Sistem Simpan -->
  <path d="M 510 419 L 820 419" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Sistem: Simpan Hitung Fisik -->
  <rect x="820" y="400" width="250" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="417" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Simpan Hitungan Fisik Parsial/Penuh</text>
  <text x="945" y="430" text-anchor="middle" font-size="8" fill="#0f172a">&amp; Hitung Progres (109 / 111 Selesai)</text>
  <line x1="945" y1="442" x2="945" y2="470" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Selesai 111 Item? -->
  <polygon points="945,470 990,490 945,510 900,490" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="945" y="493" text-anchor="middle" font-size="8" font-weight="bold" fill="#0f172a">Semua Dihitung?</text>

  <!-- [Belum] Kembali ke Kasir -->
  <text x="860" y="485" font-size="8" font-weight="bold" fill="#dc2626">[Belum]</text>
  <path d="M 900 490 L 395 490 L 395 440" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- [Sudah] Buka Akses Tombol Verifikasi ke Admin -->
  <text x="955" y="525" font-size="8" font-weight="bold" fill="#16a34a">[Sudah 111 Item]</text>
  <line x1="945" y1="510" x2="945" y2="545" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="545" width="250" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="562" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Aktifkan Tombol "Verifikasi Selisih"</text>
  <text x="945" y="575" text-anchor="middle" font-size="8" fill="#0f172a">pada Antarmuka Admin Toko</text>

  <!-- Sistem ke Admin -->
  <path d="M 820 566 L 760 566" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= 3. ADMIN: VERIFIKASI & MUTASI ================= -->
  <rect x="550" y="545" width="210" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="655" y="562" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Admin Buka Tahap 2:</text>
  <text x="655" y="575" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Tekan "Verifikasi Selisih"</text>

  <!-- Admin ke Sistem Filter -->
  <path d="M 760 580 L 820 580" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="615" width="250" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="632" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Filter Otomatis Daftar Kerja Verifikasi:</text>
  <text x="945" y="644" text-anchor="middle" font-size="8" fill="#16a34a">105 Barang Sesuai Disembunyikan</text>
  <text x="945" y="654" text-anchor="middle" font-size="8" fill="#dc2626">Hanya 6 Produk Berselisih Ditampilkan</text>

  <!-- Sistem ke Admin -->
  <path d="M 820 638 L 760 638" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="615" width="210" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="655" y="632" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Evaluasi Kuantitas 6 Anomali &amp;</text>
  <text x="655" y="645" text-anchor="middle" font-size="8.5" fill="#0f172a">Estimasi Kerugian (Berdasarkan Harga Beli)</text>
  <line x1="655" y1="661" x2="655" y2="690" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="690" width="210" height="48" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="655" y="707" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Pilih Kategori Mutasi (Radio Button):</text>
  <text x="655" y="719" text-anchor="middle" font-size="8" fill="#0f172a">Rusak / Expired / Hilang / Kelebihan Kirim</text>
  <text x="655" y="729" text-anchor="middle" font-size="8" fill="#0f172a">&amp; Centang Serial Number pada Alkes SN</text>
  <line x1="655" y1="738" x2="655" y2="765" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="550" y="765" width="210" height="38" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="655" y="788" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Eksekusi Mutasi Selisih</text>

  <!-- Admin ke Sistem Mutasi -->
  <path d="M 760 784 L 820 784" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="765" width="250" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="782" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Perbarui Stok Batch, Toko, &amp; Serial Number,</text>
  <text x="945" y="794" text-anchor="middle" font-size="8.5" fill="#0f172a">Serta Catatkan Transaksi ke Kartu Stok</text>
  <line x1="945" y1="811" x2="945" y2="840" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision: Selesai Mutasi 6 Item? -->
  <polygon points="945,840 990,860 945,880 900,860" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="945" y="863" text-anchor="middle" font-size="8" font-weight="bold" fill="#0f172a">Semua Dimutasi?</text>

  <!-- [Belum] Kembali ke Admin -->
  <text x="860" y="855" font-size="8" font-weight="bold" fill="#dc2626">[Belum]</text>
  <path d="M 900 860 L 655 860 L 655 805" fill="none" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- [Sudah] Berikan Hak Penutupan Sesi ke Superadmin -->
  <text x="955" y="895" font-size="8" font-weight="bold" fill="#16a34a">[Sudah 6/6 Dimutasi]</text>
  <line x1="945" y1="880" x2="945" y2="915" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="915" width="250" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="932" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Aktifkan Tombol Penutupan Sesi</text>
  <text x="945" y="945" text-anchor="middle" font-size="8" fill="#0f172a">(Khusus Akun Superadmin)</text>

  <!-- Sistem ke Superadmin -->
  <path d="M 820 936 L 245 936" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ================= 4. SUPERADMIN: TUTUP SESI & BERITA ACARA ================= -->
  <rect x="25" y="915" width="220" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="135" y="932" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Tekan Tombol</text>
  <text x="135" y="945" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">"Selesaikan Sesi (Buka Kunci Server)"</text>

  <!-- Superadmin ke Sistem Unfreeze -->
  <path d="M 135 957 L 135 990 L 820 990" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="970" width="250" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="987" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#16a34a">Lepas Status "System Freeze Lock"</text>
  <text x="945" y="1000" text-anchor="middle" font-size="8.5" fill="#16a34a">(POS Kasir &amp; E-Commerce Aktif Normal)</text>
  <line x1="945" y1="1016" x2="945" y2="1045" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="820" y="1045" width="250" height="44" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="945" y="1062" text-anchor="middle" font-size="9" font-weight="bold" fill="#0f172a">Terbitkan Berita Acara Stok Opname</text>
  <text x="945" y="1075" text-anchor="middle" font-size="8" fill="#0f172a">(Format Cetak Resmi A4 &amp; Sorotan Merah Selisih)</text>

  <!-- Sistem ke Superadmin & Admin untuk TTD -->
  <path d="M 820 1067 L 400 1067 L 400 1115" fill="none" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- TTD & Arsip -->
  <rect x="250" y="1115" width="300" height="46" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="1133" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0f172a">Superadmin &amp; Admin Menandatangani,</text>
  <text x="400" y="1146" text-anchor="middle" font-size="9" fill="#0f172a">Mencetak &amp; Mengarsipkan Berita Acara</text>

  <!-- Final Node -->
  <line x1="400" y1="1161" x2="400" y2="1200" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="400" cy="1215" r="14" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="400" cy="1215" r="8" fill="#0f172a"/>
</svg>
