<script>
const DATA = {"qa": [{"cat": "qa", "badge": "Konsep", "q": "Apa itu Omnichannel dan apa bedanya dengan Multichannel?", "tags": "omnichannel multichannel pengertian definisi beda sinkronisasi pos ecommerce stok terpusat", "a": "Multichannel berarti toko punya beberapa saluran jualan (toko fisik & online) tetapi stok dan datanya terpisah sehingga rawan overselling. Omnichannel menyatukan seluruh saluran jualan (Kasir POS Luring, E-Commerce Pengiriman, dan Pick-up in Store) ke dalam SATU sumber database stok terpusat secara real-time, sehingga transaksi di satu kanal langsung memengaruhi ketersediaan stok di kanal lain."}, {"cat": "qa", "badge": "Konsep", "q": "Apa itu FEFO dan kenapa obat pakai FEFO, bukan FIFO?", "tags": "fefo fifo pengertian obat kadaluarsa expired tgl_exp urutan batch", "a": "FEFO (First Expired First Out) mengeluarkan barang berdasarkan tanggal kedaluwarsa terdekat terlebih dahulu, bukan tanggal masuk gudang (FIFO). Pada produk farmasi/obat, batch yang baru datang dari supplier bisa saja memiliki tanggal kedaluwarsa lebih dekat dibanding stok lama. Di sistem ZenCare, query SQL memakai ORDER BY tgl_exp ASC dengan syarat tgl_exp >= CURDATE()."}, {"cat": "qa", "badge": "Konsep", "q": "Apa itu Multi-UOM (Konversi Satuan / Bongkar Box)?", "tags": "multi uom konversi satuan bongkar box karton strip botol rasio pecahan", "a": "Multi-UOM memungkinkan 1 produk memiliki dua tingkat kemasan (misal 1 Karton = 50 Botol pada Hufagrip, atau 1 Box = 10 Strip pada Amoxicillin). E-Commerce menjual kemasan besar utuh (Karton/Box), sedangkan Kasir POS bisa menjual grosir maupun eceran. Saat stok eceran habis, kasir/admin membongkar 1 Dus menjadi sub-batch eceran (.A, .B, .D) yang tercatat keluar Rp0 di Kartu Stok Besar dan masuk di Kartu Stok Kecil."}, {"cat": "qa", "badge": "Konsep", "q": "Apa itu Race Condition dan bagaimana sistem mencegah Overselling?", "tags": "race condition rebutan stok overselling for update pessimistic locking transaksi bersamaan", "a": "Race Condition terjadi ketika dua transaksi (misal Kasir POS dan Pelanggan E-Commerce) memperebutkan stok terakhir secara bersamaan. Sistem mencegahnya dengan transaksi database (beginTransaction) dan Pessimistic Row-Level Locking (SELECT ... FOR UPDATE pada stok_toko, stok_batch, dan unit_serial). Transaksi pertama mengunci baris stok hingga selesai/commit; transaksi kedua baru membaca stok terbaru sehingga otomatis ditolak jika stok sudah habis."}, {"cat": "qa", "badge": "Konsep", "q": "Apa itu Stok Opname, Freeze Lock, Blind Count, dan Segregation of Duties?", "tags": "stok opname freeze lock blind count segregation of duties pemisahan tugas kasir netral audit", "a": "Stok Opname adalah pencocokan fisik barang di rak dengan angka sistem. (1) Freeze Lock: saat Superadmin membuka sesi, seluruh transaksi POS, E-Commerce, penerimaan, dan konversi dibekukan agar angka stok tidak bergerak. (2) Blind Count: Kasir menghitung fisik (Baik/Rusak/Expired) tanpa melihat angka komputer agar objektif. (3) Segregation of Duties: Kasir dipilih menghitung karena tidak mengelola gudang (netral), Admin memverifikasi & memutasi selisih tanpa bisa mengedit hitungan Kasir, dan Superadmin yang membuka/mengoreksi/menutup sesi."}, {"cat": "qa", "badge": "Kebijakan Sistem", "q": "Stok Opname biasanya dilakukan berapa kali? Di sistem ini bagaimana?", "tags": "stok opname berapa kali jadwal rutin bulanan triwulan mendadak frekuensi", "a": "Di operasional apotek/toko alkes, stok opname umumnya dilakukan 1 bulan sekali (rutin awal/akhir bulan) atau per triwulan (3 bulan sekali), ditambah opname mendadak bila dicurigai ada selisih besar. Di sistem ZenCare, jadwalnya fleksibel (on-demand): Superadmin bisa memulai sesi kapan saja sesuai kebutuhan, namun sistem membatasi hanya 1 sesi aktif dalam satu waktu (Freeze Lock). Pada histori data sistem terdapat contoh Opname Triwulan III dan Opname Rutin Awal Bulan."}, {"cat": "qa", "badge": "Kebijakan Sistem", "q": "Stok minimum itu biasanya berapa? Di sistem ini berapa & bagaimana cara kerjanya?", "tags": "stok minimum menipis berapa batas alert warning dashboard besar kecil fast moving", "a": "Tidak dipatok 1 angka kaku — stok minimum diatur per variasi dan dipisah antara satuan besar (stok_minimum_besar) dan satuan kecil (stok_minimum_kecil) agar bisa disesuaikan dengan produk fast-moving/slow-moving. Pada data ZenCare saat ini: Obat Multi-UOM diset minimum 2 Karton/Box (besar) dan 5–10 Strip/Botol (kecil); sedangkan Alkes diset minimum 5 Unit. Jika stok dus <= min besar ATAU stok eceran <= min kecil, produk otomatis muncul di tabel Peringatan Stok Menipis pada Dashboard."}, {"cat": "qa", "badge": "Kebijakan Sistem", "q": "Pengawasan kedaluwarsa (mendekati ED) di sistem ini berapa hari sebelum ED?", "tags": "kadaluarsa expired berapa hari batas_hari_expired 90 hari 180 hari 30 hari pengawasan ed warning", "a": "Batas hari pengawasan diatur fleksibel per produk melalui kolom produk_induk.batas_hari_expired (default fallback 30 hari jika kosong). Pada data ZenCare saat ini: mayoritas Obat (33 produk) & BMHP (10 produk) diset 90 hari (3 bulan sebelum ED) agar masih sempat dilakukan promo/retur distributor; 2 produk obat khusus diset 180 hari (6 bulan); dan 8 Alkes non-ED (seperti Tensimeter/Termometer) diset 0 karena menggunakan pelacakan Serial Number & garansi."}, {"cat": "qa", "badge": "Kebijakan Sistem", "q": "Berapa lama batas waktu pembayaran (expiry) Midtrans di POS dan E-Commerce?", "tags": "midtrans timer batas waktu expiry menit jam 5 menit 120 menit 2 jam otomatis batal cooldown", "a": "Dikonfigurasi di config/config.php: (1) POS Kasir (QRIS) = 5 menit karena pelanggan walk-in berada di depan meja kasir. (2) E-Commerce (semua kanal QRIS/VA/E-Wallet) = 120 menit (2 jam). Jika lewat 2 jam belum dibayar, fungsi batalkanPesananKadaluarsa() otomatis membatalkan pesanan dan mengembalikan stok yang terkunci (reserved)."}, {"cat": "qa", "badge": "Kebijakan Sistem", "q": "Kenapa Estimasi Kerugian di Berita Acara Stok Opname memakai Harga Beli, bukan Harga Jual?", "tags": "kerugian harga beli harga jual modal hpp berita acara stok opname akuntansi", "a": "Secara akuntansi persediaan, kerugian riil yang ditanggung ZenCare Medical atas barang hilang, rusak, atau kedaluwarsa adalah nilai modal perolehan (Harga Pokok / Harga Beli dari penerimaan terakhir), bukan harga jual yang sudah memuat margin keuntungan. Sedangkan selisih lebih (surplus) tidak dihitung sebagai kerugian karena merupakan kelebihan fisik dari pengiriman supplier."}, {"cat": "qa", "badge": "Teknis API", "q": "Bagaimana Kurir Internal Malang menghitung jarak dan tarif? Pakai API apa?", "tags": "kurir internal malang jarak leaflet haversine peta koordinat ongkir rumus api gratis", "a": "Peta interaktif memakai Leaflet.js (OpenStreetMap) untuk mengambil titik koordinat (latitude, longitude) lokasi pembeli. Jarak dihitung langsung oleh kode JavaScript menggunakan Rumus Haversine (calculateHaversineDistance, jari-jari bumi R = 6.371 km) dari toko ZenCare Muharto (-7.9881, 112.6371) ke pin pembeli — tanpa API jarak berbayar sehingga gratis dan instan. Tarif: Rp 10.000 (2 km pertama) + Rp 3.000/km berikutnya + Rp 2.000/kg di atas 1 kg, dibulatkan ke atas kelipatan Rp 1.000."}, {"cat": "qa", "badge": "Teknis API", "q": "Apakah Label Pengiriman 100x150mm terhubung ke RajaOngkir untuk generate resi JNE otomatis?", "tags": "label pengiriman resi awb rajaongkir jne cetak stiker internal kurir luar kota", "a": "Tidak — API RajaOngkir Komerce digunakan khusus untuk data wilayah (provinsi/kota) dan kalkulasi tarif ongkir + estimasi pengiriman (JNE/POS/J&T). Label 100x150mm (admin/cetak_label_pengiriman.php) adalah label alamat & identifikasi paket internal sistem ZenCare (berisi kurir, layanan, alamat, barcode invoice JsBarcode, dan rincian batch/SN) untuk mempermudah packing gudang. Untuk kurir toko langsung dipakai mengantar; untuk JNE/POS/J&T ditempel sebelum diserahkan ke agen ekspedisi."}, {"cat": "qa", "badge": "Kebijakan Sistem", "q": "Kenapa pesanan E-Commerce yang baru dibayar/Diproses belum masuk Kartu Stok?", "tags": "kartu stok reservasi terkunci menunggu pembayaran diproses dikirim selesai pickup", "a": "Karena saat Menunggu Pembayaran dan Diproses, barang fisiknya masih berada di rak gudang. Sistem hanya mengunci (reserve) stok di stok_toko & pesanan_batch_alokasi agar tidak terjual ganda di kasir. Pencatatan Keluar di Kartu Stok baru dilakukan ketika barang benar-benar meninggalkan toko secara fisik (status Dikirim untuk Kurir, atau Selesai untuk Pick-up). Bila batal sebelum dikirim, reservasi langsung dilepas tanpa mengotori Kartu Stok."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau internet / API Midtrans / RajaOngkir sedang gangguan atau offline?", "tags": "pengandaian internet mati offline midtrans down rajaongkir error fallback tunai cache", "a": "(1) Di Kasir POS, pembayaran Tunai tetap berjalan 100% lokal tanpa internet, dan aset JS utama (Tailwind/SweetAlert/JsBarcode/html5-qrcode) sudah tersedia lokal offline. (2) Di E-Commerce, RajaOngkir memiliki cache lokal 7–30 hari di folder cache/ serta fallback daftar wilayah & kalkulator tarif cadangan di api/indonesia_regions.php, dan Kurir Internal (Haversine) tetap jalan. (3) Jika Midtrans dimatikan di Pengaturan API, sistem menampilkan pesan informatif tanpa crash."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau stiker barcode rusak/buram atau kamera laptop tidak terbaca?", "tags": "pengandaian barcode rusak buram kamera tidak terbaca webcam gelap upload foto manual ketik", "a": "Sistem menyediakan 3 jalur cadangan berlapis: (1) Kamera webcam memakai BarcodeDetector native browser, (2) Tombol \"Upload Foto Barcode\" di modal kamera (scanFileV2) bila autofocus webcam terganggu pencahayaan, dan (3) Input manual ketik SKU / No. Batch / Serial Number di kolom scanner atau pencarian POS/Packing."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau pelanggan di kasir menolak batch FEFO (misal kemasan agak penyok) dan minta batch lain?", "tags": "pengandaian pelanggan tolak batch fefo anomali kemasan penyok tukar batch log", "a": "Sistem tidak kaku mematikan penjualan: saat kasir memindai batch non-FEFO, muncul peringatan ANOMALI FEFO TERDETEKSI. Jika kasir memilih Tetap Lanjutkan, transaksi tetap bisa diproses, namun sistem otomatis merekam deviasi ke tabel log_anomali_fefo dan memunculkan indikator \"Batch Terlewat\" di Kasir serta Laporan Anomali FEFO Superadmin agar batch yang terlewat segera diprioritaskan pada transaksi berikutnya."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau obat sudah kedaluwarsa tidak sengaja terscan di kasir atau saat packing online?", "tags": "pengandaian obat kadaluarsa expired terscan blokir mutlak safety guard", "a": "Berbeda dengan anomali FEFO, obat yang sudah melewati tanggal kedaluwarsa (tgl_exp < CURDATE()) DIBLOKIR MUTLAK (hard block) di POS Kasir maupun Packing E-Commerce dengan peringatan OBAT KADALUARSA. Barang tidak bisa masuk keranjang atau dikirim, dan staf diarahkan memisahkannya ke karantina / Mutasi Keluar (Barang Kedaluwarsa)."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau Kasir salah mengetik angka fisik saat Blind Count Stok Opname?", "tags": "pengandaian kasir salah input ketik blind count koreksi superadmin admin tidak bisa ubah", "a": "Selama tahap Penghitungan belum ditutup, Kasir masih bisa memperbaiki inputnya. Setelah masuk tahap Verifikasi, Admin Toko TIDAK bisa mengubah angka hitungan Kasir (hanya memverifikasi & memutasi selisih). Jika ditemukan kesalahan hitung lapangan, hanya Superadmin yang berwenang melakukan koreksi melalui aksi koreksi_hitung_superadmin, dan riwayat sebelum/sesudah + alasannya otomatis tercatat di tabel audit riwayat_hitung_opname."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau barang dari supplier datang rusak sebagian saat Penerimaan Barang?", "tags": "pengandaian barang rusak penerimaan supplier retur menunggu pengganti potong faktur", "a": "Admin menginput jumlah diterima baik (masuk stok & Kartu Stok) dan jumlah rusak secara terpisah pada form Penerimaan Barang. Barang rusak tidak dicampur ke stok layak jual, melainkan otomatis berstatus menunggu_pengganti dan muncul di widget Status Retur Supplier pada Dashboard. Saat supplier mengirim pengganti (atau memotong faktur), Admin mencatat penyelesaian retur beserta batch/ED penggantinya."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau pelanggan sudah checkout & bayar E-Commerce tapi ingin membatalkan pesanan?", "tags": "pengandaian batal pesanan pelanggan sudah bayar menunggu pembayaran diproses request batal", "a": "(1) Jika status masih Menunggu Pembayaran: pelanggan bisa langsung klik Batal di Profil -> stok reservasi otomatis kembali. (2) Jika sudah dibayar (status Diproses): pelanggan tidak bisa membatalkan sepihak karena gudang mungkin sedang mengemas; pelanggan menekan tombol Ajukan Pembatalan dengan alasan, lalu Admin Toko yang menyetujui/menolak. (3) Jika sudah Dikirim/Siap Diambil/Selesai: pembatalan diblokir sistem."}, {"cat": "whatif", "badge": "Pengandaian", "q": "Bagaimana kalau 1 unit Alkes ber-SN rusak diklaim garansi atau tidak sengaja terscan 2 kali?", "tags": "pengandaian alkes sn ganda rusak garansi klaim terjual", "a": "(1) Scan SN yang sama 2 kali di POS otomatis ditolak oleh guard snUsedDup. (2) SN berstatus Retur/Rusak diblokir mutlak saat discan. (3) SN berstatus Terjual diblokir untuk dijual ulang, dan sistem langsung menampilkan nomor invoice, tanggal beli, serta sisa hari garansi aktifnya untuk layanan klaim garansi."}], "code": [{"title": "Ubah Header, Sidebar, Warna Tema & Tulisan UI", "files": "config/layout.php (Backoffice) | ecommerce/header.php (Toko Online) | pos/pos.php (Kasir) | admin/pengaturan_web.php", "find": "tailwind.config (layout.php:26, header.php:59, pos.php:437) | layoutSidebar (layout.php:282) | layoutHeader (layout.php:399)", "tags": "u let activeTab = 'all';

function expandTokens(raw) {
  const base = raw.toLowerCase().replace(/[^a-z0-9_.\- ]/g,' ').split(/\s+/).filter(Boolean);
  const out = new Set(base);
  base.forEach(tok => {
    if (SYNONYMS[tok]) SYNONYMS[tok].forEach(s => out.add(s));
  });
  return { base, expanded: Array.from(out) };
}

function scoreText(haystack, queryRaw) {
  if (!queryRaw) return 1;
  const h = haystack.toLowerCase();
  const q = queryRaw.toLowerCase().trim();
  let s = 0;
  if (h.includes(q)) s += 20;
  const { base, expanded } = expandTokens(q);
  let baseHits = 0;
  base.forEach(t => { if (h.includes(t)) { s += 8; baseHits++; } });
  expanded.forEach(t => { if (h.includes(t)) s += 2; });
  if (base.length > 0 && baseHits === base.length) s += 10;
  return s;
}

function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hl(text, queryRaw) {
  let safe = esc(text);
  if (!queryRaw || queryRaw.trim().length < 2) return safe;
  const toks = queryRaw.trim().toLowerCase().split(/\s+/).filter(t => t.length >= 2);
  toks.forEach(t => {
    const escapedTok = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const rx = new RegExp('(' + escapedTok + ')', 'gi');
    safe = safe.replace(rx, '<mark>$1</mark>');
  });
  return safe;
}

function copyVal(v) {
  navigator.clipboard?.writeText(v).catch(()=>{});
  const t = document.getElementById('toast');
  t.innerText = 'Disalin: ' + v;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

function render() {
  const q = document.getElementById('q').value.trim();
  document.getElementById('clearBtn').style.display = q ? 'block' : 'none';

  let cards = [];

  // Demo cards
  if (activeTab === 'all' || activeTab === 'demo') {
    DEMO_CARDS.forEach(c => {
      const sc = scoreText(c.title + ' ' + c.body + ' ' + c.tags, q);
      if (sc > 0) cards.push({ score: sc, sec: 'Alur Demo & Kode Uji', html:
        `<div class="card"><div class="card-head"><h3 class="card-title">${hl(c.title, q)}</h3><span class="badge ${c.color}">${esc(c.badge)}</span></div><p>${hl(c.body, q)}</p>` +
        (c.copies ? `<div class="copy-row">` + c.copies.map(x => `<button class="copy-btn" onclick="copyVal('${x.replace(/'/g,"\'")}')">📋 ${esc(x)}</button>`).join('') + `</div>` : '') +
        `</div>` });
    });
  }

  // Q&A + What-if
  DATA.qa.forEach(c => {
    if (activeTab !== 'all' && activeTab !== c.cat) return;
    const sc = scoreText(c.q + ' ' + c.a + ' ' + c.tags + ' ' + c.badge, q);
    if (sc > 0) {
      const clr = c.cat === 'whatif' ? 'amber' : (c.badge === 'Teknis API' ? 'green' : '');
      cards.push({ score: sc, sec: c.cat === 'whatif' ? 'Pengandaian ("Bagaimana Kalau...")' : 'Q&A Penguji (Konsep & Kebijakan)', html:
        `<div class="card"><div class="card-head"><h3 class="card-title">${hl(c.q, q)}</h3><span class="badge ${clr}">${esc(c.badge)}</span></div><p>${hl(c.a, q)}</p></div>` });
    }
  });

  // Code map
  if (activeTab === 'all' || activeTab === 'code') {
    DATA.code.forEach(c => {
      const sc = scoreText(c.title + ' ' + c.files + ' ' + c.find + ' ' + c.desc + ' ' + c.tags, q);
      if (sc > 0) {
        const firstFind = c.find.split('  atau  ')[0].split(' (')[0].trim();
        cards.push({ score: sc, sec: 'Peta Kode Sumber & Cara Ubah UI', html:
          `<div class="card"><div class="card-head"><h3 class="card-title">${hl(c.title, q)}</h3><span class="badge">Kode</span></div>` +
          `<div class="code-line"><b>File:</b> ${hl(c.files, q)}<br><b>Ctrl+F:</b> ${hl(c.find, q)}</div>` +
          `<p>${hl(c.desc, q)}</p>` +
          `<div class="copy-row"><button class="copy-btn" onclick="copyVal('${firstFind.replace(/'/g,"\'")}')">📋 Copy Ctrl+F: ${esc(firstFind)}</button></div></div>` });
      }
    });
  }

  // DB 20 tables
  if (activeTab === 'all' || activeTab === 'db') {
    DATA.db.forEach(c => {
      const sc = scoreText(c.group + ' ' + c.table + ' ' + c.desc + ' ' + c.tags, q);
      if (sc > 0) {
        cards.push({ score: sc, sec: 'Peta Database db_inventory (20 Tabel)', html:
          `<div class="card"><div class="card-head"><h3 class="card-title" style="font-family:ui-monospace,Consolas,monospace">${hl(c.table, q)}</h3><span class="badge green">${esc(c.group)}</span></div><p>${hl(c.desc, q)}</p></div>` });
      }
    });
  }

  // New products
  if (activeTab === 'all' || activeTab === 'newprod') {
    NEW_PROD_CARDS.forEach(c => {
      const sc = scoreText(c.title + ' ' + c.body + ' ' + c.tags, q);
      if (sc > 0) cards.push({ score: sc, sec: 'Data Cadangan Tambah Produk Baru', html:
        `<div class="card"><div class="card-head"><h3 class="card-title">${hl(c.title, q)}</h3><span class="badge ${c.color}">${esc(c.badge)}</span></div><p>${hl(c.body, q)}</p>` +
        `<div class="copy-row">` + c.copies.map(x => `<button class="copy-btn" onclick="copyVal('${x.replace(/'/g,"\'")}')">📋 ${esc(x)}</button>`).join('') + `</div></div>` });
    });
  }

  const container = document.getElementById('content');
  const hint = document.getElementById('resultHint');
  if (cards.length === 0) {
    hint.innerText = 'Tidak ada hasil untuk "' + q + '". Coba kata lain (mis. "ubah header", "jarak", "opname", "tabel stok").';
    container.innerHTML = '<div class="empty">Tidak ditemukan. Coba kata kunci yang lebih singkat seperti <b>header</b>, <b>jarak</b>, <b>kadaluarsa</b>, <b>midtrans</b>, atau <b>konversi</b>.</div>';
    return;
  }

  if (q) {
    cards.sort((a,b) => b.score - a.score);
    hint.innerText = 'Menampilkan ' + cards.length + ' hasil paling relevan untuk "' + q + '" (urut dari paling cocok):';
    container.innerHTML = cards.map(c => c.html).join('');
  } else {
    hint.innerText = 'Total ' + cards.length + ' kartu panduan. Ketik bebas di atas untuk pencarian instan saat tanya-jawab sidang.';
    let html = '', lastSec = '';
    cards.forEach(c => {
      if (c.sec !== lastSec) {
        html += `<div class="section-title"><span>${esc(c.sec)}</span></div>`;
        lastSec = c.sec;
      }
      html += c.html;
    });
    container.innerHTML = html;
  }
}

function clearSearch() {
  document.getElementById('q').value = '';
  render();
  document.getElementById('q').focus();
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('chips').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if (!btn) return;
  document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  render();
});

render();
</script>
</body>
</html>
