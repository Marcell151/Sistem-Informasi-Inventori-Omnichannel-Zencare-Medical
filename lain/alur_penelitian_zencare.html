<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambar Alur Penelitian Bab III — ZenCare Medical</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 28px; color: #0f172a; }
        .wrap { max-width: 1280px; margin: 0 auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(15,23,42,0.06); }
        .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 18px; }
        h1 { margin: 0; font-size: 18px; color: #0f2d5a; }
        .sub { margin: 4px 0 0; font-size: 12px; color: #64748b; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn { padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; color: #0f2d5a; display: inline-flex; align-items: center; gap: 6px; }
        .btn:hover { background: #f8fafc; }
        .btn-primary { background: #0f2d5a; color: #fff; border-color: #0f2d5a; }
        .btn-primary:hover { background: #1a4b8c; }
        .stage { background: #fff; text-align: center; }
        .stage img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        @media print {
            body { background: #fff; padding: 0; }
            .wrap { border: none; box-shadow: none; padding: 0; }
            .bar { display: none; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="bar">
            <div>
                <h1>Gambar Alur Penelitian — Bab III (Metode Penelitian RAD)</h1>
                <p class="sub">Siap tempel ke Microsoft Word (tersedia PNG HD siap pakai, vektor SVG, dan file asli Draw.io).</p>
            </div>
            <div class="actions">
                <a class="btn" href="Gambar_3.1_Alur_Penelitian.drawio" download="Gambar_3.1_Alur_Penelitian.drawio">Unduh Draw.io</a>
                <a class="btn" href="Gambar_3.1_Alur_Penelitian.svg" download="Gambar_3.1_Alur_Penelitian.svg">Unduh SVG</a>
                <a class="btn btn-primary" href="revisi_semhas_gambar/Gambar_3.1_Alur_Penelitian.png" download="Gambar_3.1_Alur_Penelitian.png">Unduh PNG (HD)</a>
            </div>
        </div>
        <div class="stage">
            <img id="svgImg" src="revisi_semhas_gambar/Gambar_3.1_Alur_Penelitian.png" onerror="this.src='Gambar_3.1_Alur_Penelitian.svg'" alt="Alur Penelitian ZenCare Medical">
        </div>
    </div>
</body>
</html>
