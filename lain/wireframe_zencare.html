<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Murni – ZenCare Medical Omnichannel</title>
    <style>
        /* ── FONT & PALET WIREFRAME STRICT ── */
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #ffffff;
            --bg2: #ffffff;
            --bg3: #ffffff;
            --border: #000000;
            --border2: #000000;
            --text: #000000;
            --text2: #000000;
            --text3: #000000;
            --accent: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
            /* Paksa sudut tajam */
            color: #000 !important;
            /* Paksa teks hitam */
        }

        body {
            font-family: 'DM Mono', monospace !important;
            background: #f4f4f4 !important;
            min-height: 100vh;
            filter: grayscale(100%) contrast(120%);
        }

        /* ── SHELL & LAYOUT NAVIGASI ── */
        .shell {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .nav-panel {
            width: 240px;
            flex-shrink: 0;
            background: #fff !important;
            border-right: 2px solid #000 !important;
            display: flex;
            flex-direction: column;
        }

        .nav-header {
            padding: 16px 14px 10px;
            border-bottom: 2px solid #000 !important;
        }

        .nav-header-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .04em;
        }

        .nav-header-sub {
            font-size: 9px;
            margin-top: 2px;
        }

        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .nav-section-label {
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 10px 14px 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 10px;
            border: 1px solid transparent;
        }

        .nav-item.active {
            background: #000 !important;
            color: #fff !important;
        }

        .nav-num {
            width: 16px;
            height: 16px;
            border: 1px solid #000 !important;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: #fff !important;
        }

        .nav-item.active .nav-num {
            background: #fff !important;
            color: #000 !important;
            font-weight: 600;
            border-color: #fff !important;
        }

        /* ── MAIN AREA ── */
        .main {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .main-topbar {
            height: 44px;
            background: #fff !important;
            border-bottom: 2px solid #000 !important;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
            flex-shrink: 0;
        }

        .main-topbar-title {
            font-size: 12px;
            font-weight: 600;
        }

        .main-topbar-sub {
            font-size: 10px;
        }

        .page-badge,
        .role-badge {
            font-size: 9px;
            background: #fff !important;
            border: 1px solid #000 !important;
            padding: 3px 10px;
            font-weight: 600;
        }

        .page-badge {
            margin-left: auto;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f4f4f4 !important;
        }

        /* ── WIREFRAME CONTAINERS (Brutalist style) ── */
        .wf,
        .card,
        .sc,
        .hero,
        .login-bg {
            background: #fff !important;
            border: 1px solid #000 !important;
            box-shadow: 3px 3px 0px #000 !important;
            overflow: hidden;
        }

        .card {
            padding: 12px;
        }

        .sc {
            padding: 10px 12px;
        }

        .hero {
            padding: 14px 18px;
            margin-bottom: 12px;
        }

        /* ── UTILITIES ── */
        .row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .flex1 {
            flex: 1;
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .g3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .g4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        /* ── CUSTOM APP LAYOUT (Sidebar dalam konten) ── */
        .wf-topbar {
            height: 36px;
            background: #fff !important;
            border-bottom: 1px solid #000 !important;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 8px;
        }

        .wf-sidebar {
            width: 140px;
            flex-shrink: 0;
            padding: 10px 0;
            border-right: 1px solid #000 !important;
            background: #fff !important;
            display: flex;
            flex-direction: column;
        }

        .wf-si {
            height: 18px;
            margin: 2px 8px;
            border: 1px solid #000 !important;
            background: #fff !important;
            display: flex;
            align-items: center;
            padding: 0 5px;
            font-size: 8px;
            font-weight: bold;
        }

        .wf-si.on {
            background: #000 !important;
            color: #fff !important;
        }

        .wf-sl {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: .07em;
            padding: 8px 10px 2px;
            border-top: 1px dashed #000;
            margin-top: 5px;
        }

        .wf-sl:first-child {
            border-top: none;
            margin-top: 0;
        }

        .content {
            flex: 1;
            padding: 14px;
        }

        .ph {
            font-size: 13px;
            font-weight: 600;
        }

        .psub {
            font-size: 9px;
            margin-top: 2px;
        }

        /* ── UI ELEMENTS ── */
        .btn,
        .btnp,
        .badge {
            border: 1px solid #000 !important;
            background: #fff !important;
            font-weight: 600 !important;
            text-transform: uppercase;
        }

        .btn {
            height: 24px;
            padding: 0 10px;
            display: inline-flex;
            align-items: center;
            font-size: 9px;
            cursor: pointer;
        }

        .btnp {
            background: #000 !important;
            color: #fff !important;
        }

        .badge {
            height: 18px;
            display: inline-flex;
            align-items: center;
            padding: 0 8px;
            font-size: 8px;
        }

        .inp,
        .sel,
        .textarea {
            height: 28px;
            border: 1px solid #000 !important;
            background: #fff !important;
            padding: 0 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
        }

        .textarea {
            height: 60px;
        }

        .tri {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #000 !important;
        }

        /* ── PLACEHOLDERS ── */
        .blk,
        .blk2,
        .tc,
        .tc.dk {
            background: #e0e0e0 !important;
            border: 1px solid #999 !important;
        }

        /* Image Cross Boxes */
        .img-box,
        .av,
        .wf-logo,
        .wf-user {
            background: #fff !important;
            border: 1px solid #000 !important;
            position: relative;
            color: transparent !important;
        }

        .img-box::before,
        .av::before,
        .wf-logo::before,
        .wf-user::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom right, transparent calc(50% - 1px), #000 calc(50%), transparent calc(50% + 1px));
        }

        .img-box::after,
        .av::after,
        .wf-logo::after,
        .wf-user::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top right, transparent calc(50% - 1px), #000 calc(50%), transparent calc(50% + 1px));
        }

        .wf-logo {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        .av {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
        }

        /* ── TABLES ── */
        .tbl {
            border: 1px solid #000 !important;
            background: #fff !important;
            box-shadow: 2px 2px 0px #000 !important;
            margin-bottom: 10px;
        }

        .tbl-h {
            background: #fff !important;
            border-bottom: 2px solid #000 !important;
            padding: 7px 10px;
            display: grid;
            gap: 8px;
            align-items: center;
            font-size: 8px;
            font-weight: bold;
        }

        .tbl-r {
            padding: 8px 10px;
            display: grid;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #000 !important;
            font-size: 9px;
        }

        .tbl-r:last-child {
            border-bottom: none;
        }

        /* ── OTHERS ── */
        .chk {
            width: 12px;
            height: 12px;
            border: 1px solid #000 !important;
            background: #fff !important;
            flex-shrink: 0;
        }

        .login-bg {
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #000 !important;
            margin-bottom: 12px;
        }

        .tab {
            padding: 7px 14px;
            font-size: 9px;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .tab.on {
            border-bottom: 3px solid #000 !important;
        }
    </style>
</head>

    <script>
        // ─── HELPERS ─────────────────────────────────────────────
        function sysTopbar(title = 'ZenCare') {
            return `<div class="wf-topbar"><div class="wf-logo"></div><div class="col" style="gap:2px"><div class="wf-title" style="font-weight:bold;font-size:10px;">${title}</div></div><div class="flex1"></div><div class="av" style="width:18px;height:18px;border-radius:50%;"></div></div>`;
        }

        function sysSidebar(active) {
            const menu = [
                ['UTAMA', ['Dashboard']],
                ['TRANSAKSI', ['Kasir (POS)', 'Transaksi']],
                ['MASTER DATA', ['Produk', 'Satuan & UOM', 'Supplier']],
                ['LOGISTIK', ['Penerimaan Barang', 'Mutasi Stok', 'Kartu Stok']],
                ['LAPORAN', ['Lap. Penjualan', 'Lap. Persediaan', 'Lap. Logistik Medis']],
                ['SISTEM', ['Manajemen Pengguna']]
            ];
            let h = '<div class="wf-sidebar">';
            for (const [sec, items] of menu) {
                h += `<div class="wf-sl">${sec}</div>`;
                for (const item of items) {
                    h += `<div class="wf-si${item === active ? ' on' : ''}">${item}</div>`;
                }
            }
            h += '</div>';
            return h;
        }

        function sc4(ls) {
            return `<div class="g4" style="margin-bottom:12px">${ls.map(l => `<div class="sc"><div class="blk" style="height:14px;width:30px;margin-bottom:5px;"></div><div style="font-size:14px;font-weight:bold;margin-bottom:2px;">999</div><div style="font-size:8px;">${l}</div></div>`).join('')}</div>`;
        }
