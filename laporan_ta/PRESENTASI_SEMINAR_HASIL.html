    async function loadAsDataUrl(url) {
        try {
            const resp = await fetch(url);
            const blob = await resp.blob();
            return await new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result);

            s.addTable(tblRows, { x: 0.65, y: 1.95, w: 8.35, colW: [0.5, 3.6, 0.55, 2.55, 1.15], fontSize: 9.5, border: { pt: 1, color: BORDER }, rowH: 0.42 });
            s.addShape(pptx.ShapeType.roundRect, { x: 9.25, y: 1.95, w: 3.4, h: 1.8, fill: { color: 'ECFDF5' }, line: { color: '065F46', width: 1.5 } });

            s.addShape(pptx.ShapeType.roundRect, { x: 9.25, y: 3.95, w: 3.4, h: 2.85, fill: { color: LIGHT }, line: { color: BORDER } });
            s.addText('Temuan Utama Pengujian:\n• Diuji langsung sesuai peran modulnya.\n• Scanner & FEFO mencegah salah ambil ED.\n• Freeze Lock & Blind Count menjaga Opname.\n• Reservasi stok cegah bentrok kasir.',
                { x: 9.4, y: 4.1, w: 3.1, h: 2.55, fontSize: 10.5, color: SLATE, valign: 'top' });

            // 19. Kesimpulan
            s = addChrome('Kesimpulan');
            s.addShape(pptx.ShapeType.roundRect, { x: 1.5, y: 2.0, w: 10.3, h: 4.6, fill: { color: 'FFFFFF' }, line: { color: BORDER, width: 2 } });
            s.addShape(pptx.ShapeType.roundRect, { x: 1.75, y: 2.25, w: 9.8, h: 4.1, fill: { color: LIGHT }, line: { color: BORDER } });
            s.addText(KESIMPULAN_TXT, { x: 2.05, y: 2.45, w: 9.2, h: 3.7, fontSize: 12.5, color: SLATE, valign: 'middle' });

            // 20-21. Lampiran Dokumentasi Lapangan
            s = addChrome('Lampiran: Dokumentasi Gerai ZenCare Medical');
            await addImgFit(s, IMG.foto1, 0.8, 2.0, 5.6, 4.4);
            await addImgFit(s, IMG.foto2, 6.9, 2.0, 5.6, 4.4);

            s = addChrome('Lampiran: Dokumentasi Produk & Pengambilan Data');
            await addImgFit(s, IMG.foto3, 0.7, 2.0, 3.8, 4.4);
            await addImgFit(s, IMG.foto4, 4.75, 2.0, 3.8, 4.4);
            await addImgFit(s, IMG.foto5, 8.8, 2.0, 3.8, 4.4);

            // 22. Penutup / Terima Kasih
            s = addChrome('', true);
            s.addText('Terima Kasih', { x: 1.5, y: 2.4, w: 10.3, h: 1.1, align: 'center', fontFace: 'Georgia', fontSize: 48, bold: true, color: NAVY });
            s.addText('Sesi Tanya Jawab & Diskusi', { x: 1.5, y: 3.6, w: 10.3, h: 0.5, align: 'center', fontSize: 16, bold: true, color: '64748B' });
            s.addShape(pptx.ShapeType.rect, { x: 5.9, y: 4.25, w: 1.5, h: 0.06, fill: { color: TEAL } });
            s.addText('Marcell Chandra Kenchana - 322310015', { x: 1.5, y: 4.55, w: 10.3, h: 0.5, align: 'center', fontSize: 16, bold: true, color: NAVY });

            await pptx.writeFile({ fileName: 'Seminar_Hasil_TA_Final_Browser.pptx' });
        } finally {
            btn.disabled = false;
            btn.innerHTML = origText;
